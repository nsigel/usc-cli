[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "usc-cli"
version = "0.1.0"
description = "CLI for programmatic interaction with USC's university portal (Brightspace D2L)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Noah Sigel" }]

dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
usc = "usc_cli.cli:cli"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.setuptools.packages.find]
where = ["src"]
